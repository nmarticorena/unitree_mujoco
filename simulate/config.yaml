robot: "g1"  # Robot name, "go2", "b2", "b2w", "h1", "go2w", "g1", "h2"
robot_scene: "cart_scene.xml" # Robot scene, /unitree_robots/[robot]/scene.xml
# robot_scene: "scene.xml"

domain_id: 1  # Domain id
interface: "lo" # Interface 

use_joystick: 1 # Simulate Unitree WirelessController using a gamepad
joystick_type: "xbox" # support "xbox" and "switch" gamepad layout
joystick_device: "/dev/input/js0" # Device path
joystick_bits: 16 # Some game controllers may only have 8-bit accuracy

print_scene_information: 0 # Print link, joint and sensors information of robot

enable_elastic_band: 1 # Virtual spring band, used for lifting humanoid robots
elastic_band_height: 2.4 # Default rope/elastic-band anchor height in metres
elastic_band_topic: "rt/elastic_band" # std_msgs/msg/String: enable or disable

# Reset the complete MuJoCo state and randomize the configured scene body pose.
# Publish a non-negative integer as std_msgs/msg/String. Publish -1 for a hard
# reset to the model defaults without pose randomization.
enable_scene_reset: 1
apply_scene_reset_on_startup: 1 # Apply scene_reset_pose immediately after loading the model
scene_reset_topic: "rt/reset_category"
dolly_reset_topic: "rt/reset_dolly" # "pose <x> <y> <yaw>" applies an exact pose; other strings use scene_reset_pose
scene_reset_body: "bottom_plate"
scene_reset_pose:
  position: [0.5, 0.0, 0.]          # Default pose; experiments send an explicit seeded pose
  position_margin: [0.0, 0.0, 0.0] # Legacy non-pose reset messages use these margins
  yaw: 0.0                           # Centre yaw [rad]
  yaw_margin: 0.0                     # Uniform +/- yaw margin [rad]

publish_object_pose: 1 # Publish a MuJoCo body pose through DDS as geometry_msgs/msg/PoseStamped
publish_dolly_observation: 0 # Camera process owns rt/dolly_observation; set to 1 for MuJoCo ground truth control
publish_dolly_observation_gt: 1 # Parallel GT reference on rt/dolly_observation_gt for camera comparison
# For multiple objects, keep publish_object_pose: 1 and use this list.
# When this list is present, it replaces the single object_pose_* settings above.
object_pose_publishers:
  - body: "bottom_plate"
    topic: "rt/cart_pose"
    frame: "world"
    rate_hz: 50
  - body: "fixed_torso_link"
    topic: "rt/torso_pose"
    frame: "world"
    rate_hz: 50

publish_camera: 1 # Publish the MuJoCo camera as TeleImager-compatible JPEG over ZMQ
camera_name: "head_camera"
camera_width: 640
camera_height: 480
camera_rate_hz: 90
camera_zmq_port: 55555
camera_request_port: 60000
camera_jpeg_quality: 100

# Simulated RealSense D435 left-infrared stream. TeleImager advertises this
# under head_camera.enable_ir and publishes grayscale JPEGs on ir_zmq_port.
publish_ir_camera: 1
ir_camera_name: "head_ir_camera"
ir_camera_width: 848
ir_camera_height: 480
ir_camera_rate_hz: 90
ir_camera_zmq_port: 55556
ir_camera_jpeg_quality: 100

# Start the interactive viewer in Tracking mode. This does not affect camera publishing.
viewer_track_body: "fixed_torso_link"
